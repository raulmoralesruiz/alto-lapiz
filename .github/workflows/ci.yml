name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server, web, shared)
        run: npm run typecheck

      - name: Test (server, incluye E2E por WebSocket)
        run: npm test

      - name: Build frontend
        run: npm run build
